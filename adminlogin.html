<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Login</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>

  <style>
    :root {
      --primary-color: #ffd200;
      --accent-color: #005cff;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: #f4f4f4;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    .login-container {
      background: #fff;
      border-radius: 10px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
      overflow: hidden;
    }

    .header-banner {
      background-color: var(--primary-color);
      padding: 20px;
      text-align: center;
    }

    .header-banner img {
      width: 40px;
      margin-bottom: 10px;
    }

    .header-banner h1 {
      margin: 0;
      font-size: 1.8rem;
      font-weight: bold;
      color: #111;
    }

    .header-banner p {
      margin: 0;
      color: #333;
    }

    .form-section {
      padding: 30px 25px;
    }

    .form-section h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #000;
    }

    .form-control {
      border-radius: 6px;
      padding: 12px;
      font-size: 14px;
      margin-bottom: 15px;
    }

    .btn-login {
      background-color: var(--accent-color);
      color: white;
      font-weight: bold;
      padding: 10px;
      border-radius: 6px;
      width: 100%;
    }

    .alert {
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="header-banner">
      <img src="images/logo 1.png" alt="Cab Icon" style="width: 300px;"/>

      <p>24/7 available</p>
    </div>
    <div class="form-section">
      <h2>Admin Login</h2>
      <form id="loginForm">
        <input type="email" class="form-control" id="email" placeholder="Enter your email" required />
        <input type="password" class="form-control" id="password" placeholder="Enter your password" required />
        <button type="submit" class="btn btn-login">Login</button>
        <div id="errorMsg" class="alert alert-danger d-none"></div>
      </form>
    </div>
  </div>

  <!-- Firebase Auth Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDK_6ekHT_1HnJknFtUjaHfcA0b99sVZXg",
      authDomain: "otp-service-79447.firebaseapp.com",
      projectId: "otp-service-79447",
      storageBucket: "otp-service-79447.appspot.com",
      messagingSenderId: "599825173528",
      appId: "1:599825173528:web:82d4676ded8863514b876d",
      measurementId: "G-XCTFPJ9CSY"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      try {
        const userCredential = await signInWithEmailAndPassword(auth, email, password);
        window.location.href = "Admin/dashboard.php";
      } catch (error) {
        const errorMsg = document.getElementById('errorMsg');
        errorMsg.textContent = error.message;
        errorMsg.classList.remove('d-none');
      }
    });
  </script>
</body>
</html>
